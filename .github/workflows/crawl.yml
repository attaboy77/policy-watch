name: 정책 수집 및 배포

# 2026-09-01: Phase 6 placeholder를 실제 배포 워크플로로 교체.
# 이 저장소가 예전에 완전히 별도 히스토리로 운영하던 crawler/ 기반 워크플로
# (archive된 legacy-crawler-archive 브랜치 참고)의 스케줄·시크릿·Pages 배포
# 구조를 그대로 재사용하고, 실행 대상만 crawler/main.py → sources.main으로
# 바꿨다. SPEC.md §1/§8 설계(cron 07:00 KST)와도 일치한다.
#
# 2026-09-02: site/·data/ 변경분을 push해도(예: Claude Code가 로컬에서
# summary_cache.json 반영 후 site/data.json을 수동 커밋·push하는 경우) 사이트가
# 그대로였다 — 배포가 오직 crawl 잡 완료 후에만 일어났기 때문. `push` 트리거를
# 추가하되, "수집은 다시 안 돌고 배포만" 되도록 crawl 잡을 push 이벤트에서는
# 건너뛴다(crawl.if). build 잡을 새로 분리해 아티팩트 업로드를 전담시키고,
# crawl이 스킵돼도(push 트리거) build/deploy는 정상 진행되게 needs 조건을 조정.

on:
  schedule:
    - cron: "0 22 * * *"  # 07:00 KST
  workflow_dispatch:
    inputs:
      force_mail:
        description: "신규 항목이 없어도 메일을 강제 발송(테스트용)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

# Pages 배포는 동시에 여러 개 돌면 안 된다(GitHub 권장 패턴) — cron/dispatch로
# 수집이 도는 중에 누가 site/를 push해도 서로 덮어쓰지 않고 순서대로 처리한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # schedule/workflow_dispatch에서만 돈다 — push 트리거는 이미 완성된
  # site/data.json을 그대로 배포만 하면 되므로 재수집이 필요 없다.
  crawl:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 2026-09-02: 메일 알림(sources/notify_mail.py)의 "신규 항목" 판정 기준점.
      # 수집 실행으로 site/data.json이 덮어써지기 전에, 지금(=이전 커밋) 버전을
      # 별도 경로에 남겨둔다. 최초 실행 등으로 파일이 없어도 실패하지 않게
      # `|| true` — notify_mail.py가 백업 부재를 스스로 감지해 안전하게 처리한다.
      - name: 이전 data.json 백업 (메일 신규 판정 기준점)
        run: cp site/data.json /tmp/pw_prev_data.json || true

      - name: 수집 실행
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          PROXY_BASE: ${{ secrets.PROXY_BASE }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m sources.main

      # 2026-09-02: 신규 항목(공식 L1/L2 또는 언론 L3) 발생 시 메일 발송.
      # GMAIL_USER/GMAIL_APP_PASSWORD/MAIL_TO 중 하나라도 시크릿 미등록이면
      # notify_mail.py가 스스로 감지해 조용히 건너뛴다 — 이 스텝이 실패해도
      # (SMTP 오류 등) exit 0으로 끝나므로 이후 커밋/배포에 영향 없음.
      - name: 신규 항목 메일 알림
        env:
          CURRENT_DATA_JSON: site/data.json
          PREV_DATA_JSON: /tmp/pw_prev_data.json
          FORCE_MAIL: ${{ github.event.inputs.force_mail == 'true' }}
          DASHBOARD_URL: https://attaboy77.github.io/policy-watch/
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m sources.notify_mail

      - name: 변경사항 커밋
        run: |
          git config user.name "policy-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data.json docs/EFFECTIVE_DATE_GAPS.md docs/EXCLUDED_LOG.md
          git diff --cached --quiet || git commit -m "chore: 정책 데이터 갱신 $(date +'%Y-%m-%d')"
          git push

  # 아티팩트 업로드 전담 — crawl이 돈 경우(schedule/dispatch)엔 그 잡이 push한
  # 최신 커밋을, push 트리거인 경우엔 push된 커밋을 그대로 checkout한다.
  # crawl이 건너뛰어져도(push 트리거) 이 잡은 정상 진행돼야 하므로 needs.crawl.
  # result가 'skipped'인 경우도 허용한다.
  build:
    needs: crawl
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 2026-09-02 버그 수정(#89 실측): needs: build만 있고 if가 없으면 GitHub의
  # 기본 조건 success()가 build의 "직접" 결과가 아니라 build→crawl로 이어지는
  # 전체 의존 그래프를 훑어본다 — crawl이 스킵(=success 아님)이면 build가
  # 성공해도 deploy 전체가 스킵돼버렸다(실제로 push 트리거 실행 #89에서
  # crawl:skipped, build:성공, deploy:skipped로 확인). build 잡과 똑같이
  # needs.build.result만 명시적으로 보게 해서 crawl 스킵 여부와 무관하게
  # build 성공 시 항상 돌게 한다.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
