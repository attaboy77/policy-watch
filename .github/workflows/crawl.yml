name: 정책 수집 및 배포

# 2026-09-01: Phase 6 placeholder를 실제 배포 워크플로로 교체.
# 이 저장소가 예전에 완전히 별도 히스토리로 운영하던 crawler/ 기반 워크플로
# (archive된 legacy-crawler-archive 브랜치 참고)의 스케줄·시크릿·Pages 배포
# 구조를 그대로 재사용하고, 실행 대상만 crawler/main.py → sources.main으로
# 바꿨다. SPEC.md §1/§8 설계(cron 07:00 KST)와도 일치한다.
#
# 2026-09-02: site/·data/ 변경분을 push해도(예: Claude Code가 로컬에서
# summary_cache.json 반영 후 site/data.json을 수동 커밋·push하는 경우) 사이트가
# 그대로였다 — 배포가 오직 crawl 잡 완료 후에만 일어났기 때문. `push` 트리거를
# 추가하되, "수집은 다시 안 돌고 배포만" 되도록 crawl 잡을 push 이벤트에서는
# 건너뛴다(crawl.if). build 잡을 새로 분리해 아티팩트 업로드를 전담시키고,
# crawl이 스킵돼도(push 트리거) build/deploy는 정상 진행되게 needs 조건을 조정.
#
# 2026-09-15: 그런데 summary_cache.json만 바뀐 push는 "배포만"으로는 부족했다
# — 요약을 site/data.json에 반영하는 건 `_summarize.summarize()`가 수집 실행
# 중에 캐시를 읽어야 일어나는데(sources/_summary_cache.py 표준 사용 흐름 참고),
# crawl을 건너뛰면 그 반영 자체가 안 일어나 매번 수동으로 `python -m sources.main`을
# 따로 돌려야 했다(사용자 지시). `detect` 잡을 추가해 push된 커밋 범위에
# data/summary_cache.json이 포함됐는지 확인하고, 포함됐으면 crawl도 돌게
# 했다 — site/ 같은 화면 파일만 바뀐 push는 여전히 배포만 한다.

on:
  schedule:
    - cron: "0 22 * * *"  # 07:00 KST
  workflow_dispatch:
    inputs:
      force_mail:
        description: "신규 항목이 없어도 메일을 강제 발송(테스트용)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

# Pages 배포는 동시에 여러 개 돌면 안 된다(GitHub 권장 패턴) — cron/dispatch로
# 수집이 도는 중에 누가 site/를 push해도 서로 덮어쓰지 않고 순서대로 처리한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # push 트리거일 때만 의미 있는 잡 — data/summary_cache.json이 이번에 push된
  # 커밋 범위에 포함됐는지 확인한다(schedule/workflow_dispatch는 애초에 crawl.if가
  # event_name만으로 통과하므로 이 잡의 결과를 보지 않는다). fetch-depth: 0으로
  # 전체 히스토리를 받아 `git diff`가 push 범위(before..after) 전체를 볼 수
  # 있게 한다 — push 하나에 커밋이 여러 개 섞여 있어도 놓치지 않기 위함.
  # before가 전부 0인 SHA(브랜치 최초 push 등 드문 경우)는 diff 기준점이 없으므로
  # 안전하게 "바뀐 것으로" 취급한다(크롤을 건너뛰어 반영을 놓치는 것보다 낫다).
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      summary_cache_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" | grep -qx "data/summary_cache.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # schedule/workflow_dispatch에서는 항상 돈다. push 트리거는 원래 "이미 완성된
  # site/data.json을 그대로 배포만" 하면 됐지만, push된 커밋에 summary_cache.json이
  # 포함돼 있으면(detect 잡 결과) 그 요약을 site/data.json에 반영하기 위해 crawl도
  # 돈다 — site/ 같은 화면 파일만 바뀐 push는 여전히 배포만 한다.
  crawl:
    needs: detect
    if: always() && (github.event_name != 'push' || needs.detect.outputs.summary_cache_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 2026-09-02: 메일 알림(sources/notify_mail.py)의 "신규 항목" 판정 기준점.
      # 수집 실행으로 site/data.json이 덮어써지기 전에, 지금(=이전 커밋) 버전을
      # 별도 경로에 남겨둔다. 최초 실행 등으로 파일이 없어도 실패하지 않게
      # `|| true` — notify_mail.py가 백업 부재를 스스로 감지해 안전하게 처리한다.
      - name: 이전 data.json 백업 (메일 신규 판정 기준점)
        run: cp site/data.json /tmp/pw_prev_data.json || true

      - name: 수집 실행
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          PROXY_BASE: ${{ secrets.PROXY_BASE }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m sources.main

      # 2026-09-02: 신규 항목(공식 L1/L2 또는 언론 L3) 발생 시 메일 발송.
      # GMAIL_USER/GMAIL_APP_PASSWORD/MAIL_TO 중 하나라도 시크릿 미등록이면
      # notify_mail.py가 스스로 감지해 조용히 건너뛴다 — 이 스텝이 실패해도
      # (SMTP 오류 등) exit 0으로 끝나므로 이후 커밋/배포에 영향 없음.
      - name: 신규 항목 메일 알림
        env:
          CURRENT_DATA_JSON: site/data.json
          PREV_DATA_JSON: /tmp/pw_prev_data.json
          FORCE_MAIL: ${{ github.event.inputs.force_mail == 'true' }}
          DASHBOARD_URL: https://attaboy77.github.io/policy-watch/
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m sources.notify_mail

      - name: 변경사항 커밋
        run: |
          git config user.name "policy-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          # 2026-09-07: data/source_cache.json(소스별 마지막 성공 결과)·
          # data/source_health.json(연속 실패 횟수)도 커밋 대상에 포함 — 이 두
          # 파일이 git에 없으면 다음 실행(새 VM)이 "어제 성공했던 결과"를 알 방법이
          # 없어 소스 장애 시 폴백이 무력화된다(sources/_source_health.py 참고).
          # 2026-09-10: data/sent_log.json(메일로 실제 발송된 id 누적 기록)도
          # 포함 — 안 그러면 다음 실행이 "어제 이미 보냈다"는 이력을 몰라 구글
          # 뉴스 RSS 재등장 기사를 매번 신규로 오판한다(sources/_sent_log.py 참고).
          git add site/data.json docs/EFFECTIVE_DATE_GAPS.md docs/EXCLUDED_LOG.md data/source_cache.json data/source_health.json data/sent_log.json
          git diff --cached --quiet || git commit -m "chore: 정책 데이터 갱신 $(date +'%Y-%m-%d')"

          # 2026-09-15: 사용자가 크롤 실행 도중(수집에 몇 분 걸림) 직접 push하면,
          # 봇은 그 시작 시점의 낡은 origin/main을 들고 있어 그냥 push하면
          # "fetch first"로 거부된다. push 전에 git pull --rebase로 최신 커밋
          # 위에 이 커밋을 올려 재정렬한 뒤 재시도 — 그래도 실패하면(리베이스
          # 충돌 포함) 한 번 더 시도하고, 그마저 실패하면 에러로 남긴다(사용자
          # 지시 — 조용히 넘어가지 않고 실패를 드러내야 무엇이 밀렸는지 알 수 있음).
          for attempt in 1 2 3; do
            echo "::group::push 시도 ${attempt}/3"
            if ! git pull --rebase origin main; then
              echo "git pull --rebase 실패"
              git rebase --abort 2>/dev/null || true
              echo "::endgroup::"
            elif git push origin main; then
              echo "::endgroup::"
              exit 0
            else
              echo "git push 실패"
              echo "::endgroup::"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "::error::git push 3회 시도 후에도 실패 — origin/main과 충돌했을 가능성. 수동으로 확인 필요"
          exit 1

  # 아티팩트 업로드 전담 — crawl이 돈 경우(schedule/dispatch)엔 그 잡이 push한
  # 최신 커밋을, push 트리거인 경우엔 push된 커밋을 그대로 checkout한다.
  # crawl이 건너뛰어져도(push 트리거) 이 잡은 정상 진행돼야 하므로 needs.crawl.
  # result가 'skipped'인 경우도 허용한다.
  build:
    needs: crawl
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 2026-09-02 버그 수정(#89 실측): needs: build만 있고 if가 없으면 GitHub의
  # 기본 조건 success()가 build의 "직접" 결과가 아니라 build→crawl로 이어지는
  # 전체 의존 그래프를 훑어본다 — crawl이 스킵(=success 아님)이면 build가
  # 성공해도 deploy 전체가 스킵돼버렸다(실제로 push 트리거 실행 #89에서
  # crawl:skipped, build:성공, deploy:skipped로 확인). build 잡과 똑같이
  # needs.build.result만 명시적으로 보게 해서 crawl 스킵 여부와 무관하게
  # build 성공 시 항상 돌게 한다.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
