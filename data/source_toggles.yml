# 소스 활성/비활성 설정
#
# enabled: false로 두면 그 소스는 다음 실행부터 아예 시도하지 않는다 —
# "수집 시도" 로그도, 실패 카운트(연속 실패일수)도, 메일의 "전일 데이터
# 사용" 경고도 전부 안 나온다(시도 자체를 안 하므로 실패로 잡히지 않는다).
# 다시 켜려면 enabled를 true로 바꾸기만 하면 된다 — 코드 수정 불필요.
#
# 여기 없는 소스는 기본으로 활성 상태다. 이 파일이 없거나 파싱에 실패하면
# _config.py가 "전부 활성화"로 동작한다(조용히 소스가 다 꺼지는 것보다 낫다
# — data/tax_subjects.yml과 같은 원칙).

sources:
  # 2026-10-01: 세 소스 다시 켬. 9/9에 "프록시 경유 시 0건"으로 꺼뒀던 건 오진이었을 가능성이 높다 —
  # 로컬 직접 접속에서도 목록은 정상으로 읽히고(moef 10행, 정책브리핑 20행), 그날
  # 우리 카테고리·세목에 걸리는 보도자료가 없어서 0건이었을 뿐이다. 9/9에 들어간
  # "빈 결과 = 실패" 가드가 그 정상 0건을 실패로 기록했다. 이제 main.ALLOW_EMPTY_SOURCES로
  # 0건을 정상 처리하고, 목록 행을 하나도 못 읽으면 어댑터가 예외로 올린다(프록시
  # 경유 시 진짜로 막힌 거라면 이제 "목록 행 0개" 실패로 로그에 구분돼 나온다).
  - name: moef
    enabled: true

  - name: fsc
    enabled: true

  - name: policy_briefing
    enabled: true
