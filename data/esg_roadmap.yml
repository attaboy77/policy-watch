# 지속가능성(ESG) 공시 제도화 로드맵 — 수동 관리 파일 (2026-09-02 등록)
#
# KASB의 KSSB 자발적용가능 기준서(제1호/제2호 등, doc_type="자발적용")
# 자체에는 시행일이 없다 — "그 기준을 언제부터 누가 의무 적용해야 하는가"는
# 별개의 정부 정책 발표라, sources/law_api.py처럼 자동 수집하지 않고 이
# 파일에서 수동 관리한다.
#
# 2026-09-02 조사 결과(사용자 지시로 조사만 하고 자동화는 안 함): 금융위원회
# 알림마당>위원회소식>보도자료(fsc.go.kr/no010101)를 뒤져봐도 "KSSB 제1호"/
# "제2호" 같은 기준서 번호를 직접 언급한 보도자료가 없었다 — 자동으로 기준서와
# 연결할 텍스트 단서가 없어서 크롤링 대상으로 못 삼고, 사용자가 내용을 직접
# 확정해 여기 등록했다.
#
# 출처: 금융위원회 「지속가능성(ESG) 공시 제도화 방안(최종안)」
#       2026.07.08 당정협의회 발표, https://www.fsc.go.kr/no010101/87280
# 상태: 정부 발표안(예정) — 자본시장법 개정 전이라 법적 구속력 있는 "시행일"은
#       아직 아니다(보도자료 원문: "빠르면 7월중 …자본시장법 개정안을
#       마련하기로 하였다" — 즉 발표 시점에 법안 자체가 아직 없었음). 개정법이
#       실제 공포되면 sources/official/law_api.py가 그 시점부터 정식으로
#       잡아낼 것 — 그때 아래 status를 "확정"으로 바꾸고 관련 항목도 정리할 것.

source_name: 금융위원회
